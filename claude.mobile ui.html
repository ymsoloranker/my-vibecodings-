<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Mobile</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a18;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .phone {
    width: 320px;
    height: 660px;
    background: #262624;
    border: 10px solid #0a0a09;
    border-radius: 46px;
    box-shadow: 0 0 0 2px #3a3a37, 0 20px 60px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 4px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }

  .addressbar {
    margin: 6px 14px 0;
    background: #1e1e1c;
    border-radius: 20px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #a8a89f;
    font-size: 13px;
  }

  .content {
    flex: 1;
    padding: 20px 20px 0;
    display: flex;
    flex-direction: column;
  }

  .planrow {
    text-align: center;
    font-size: 12px;
    color: #8a8a80;
    margin-bottom: 30px;
  }
  .planrow span { color: #e8a67c; }

  .greeting {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .greeting svg { flex-shrink: 0; }
  .greeting span {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    color: #c9c8bd;
  }

  .inputcard {
    background: #33332f;
    border-radius: 18px;
    padding: 16px 16px 12px;
    margin-bottom: 16px;
  }
  .inputcard input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #a8a89f;
    font-size: 14px;
    padding: 0 0 14px;
  }
  .inputcard input::placeholder { color: #7a7a70; }

  .inputrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .inputrow .left, .inputrow .right {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #c9c8bd;
  }
  .inputrow .left span {
    font-size: 13px;
    font-weight: 600;
  }
  .inputrow .right svg { opacity: 0.85; }

  .sendbtn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #4a4a44;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .sendbtn.active { background: #d97757; }

  .chiprow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .chip {
    background: #33332f;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    color: #c9c8bd;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .log {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 2px 10px;
    overflow-y: auto;
    font-size: 13px;
  }
  .msg-user {
    align-self: flex-end;
    background: #45453f;
    color: #e8e7dd;
    padding: 8px 12px;
    border-radius: 14px;
    max-width: 78%;
  }
  .msg-bot {
    align-self: flex-start;
    color: #a8a89f;
    max-width: 85%;
    line-height: 1.5;
  }

  .navbar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 14px 20px 18px;
    border-top: 1px solid #33332f;
    color: #8a8a80;
  }
  .navbar .pagecount {
    font-size: 11px;
    border: 1px solid #55554f;
    border-radius: 4px;
    padding: 1px 6px;
    color: #c9c8bd;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span>19:55</span>
    <div class="icons">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M0 9h2v2H0V9zm4-3h2v5H4V6zm4-4h2v9H8V2zm4-2h2v11h-2V0z" fill="#fff"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 11l-2-2c1.1-1.1 2.9-1.1 4 0l-2 2zm-4.2-4.2C5.4 4.7 9.6 4.7 11.7 6.8l1.4-1.4C10 2.3 5 2.3 1.9 5.4l1.4 1.4zM.5 2.7C4.9-1.7 10.1-1.7 14.5 2.7l-1.4 1.4C9.6-.4 5.4-.4 1.9 4.1L.5 2.7z" fill="#fff"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2" stroke="#fff" stroke-opacity="0.6"/><rect x="2.5" y="2.5" width="17" height="6" rx="1" fill="#fff"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.75" fill="#fff" fill-opacity="0.6"/></svg>
    </div>
  </div>

  <div class="addressbar">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a8a89f" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
    claude.ai
  </div>

  <div class="content">
    <div class="planrow">Free plan &middot; <span>Upgrade</span></div>

    <div class="greeting">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#d97757">
        <path d="M12 0l1.2 6.5L18 2.2l-2.3 6.1L22 6l-4.5 4.8L24 12l-6.5 1.2L22 18l-6.1-2.3L18 22l-4.8-4.5L12 24l-1.2-6.5L6 22l2.3-6.1L2 18l4.5-4.8L0 12l6.5-1.2L2 6l6.1 2.3L6 2l4.8 4.5L12 0z"/>
      </svg>
      <span>Claude Mobile</span>
    </div>

    <div class="log" id="log"></div>

    <div class="inputcard">
      <input id="chatInput" type="text" placeholder="How can I help you today?">
      <div class="inputrow">
        <div class="left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9c8bd" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Sonnet 5</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7a7a70" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="right">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9c8bd" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3"/></svg>
          <button class="sendbtn" id="sendBtn" aria-label="Send">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8e7dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chiprow">
      <button class="chip">&lt;/&gt; Code</button>
      <button class="chip">&#128218; Learn</button>
      <button class="chip">&#128161; Claude's choice</button>
      <button class="chip">&#9998; Write</button>
      <button class="chip">&#9749; Life stuff</button>
    </div>
  </div>

  <div class="navbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a80" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a8a80" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9c8bd" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span class="pagecount">1</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#8a8a80"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
  </div>
</div>

<script>
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const log = document.getElementById('log');

  input.addEventListener('input', () => {
    btn.classList.toggle('active', input.value.trim().length > 0);
  });

  function sendMessage() {
    const val = input.value.trim();
    if (!val) return;

    const userMsg = document.createElement('div');
    userMsg.className = 'msg-user';
    userMsg.textContent = val;
    log.appendChild(userMsg);

    input.value = '';
    btn.classList.remove('active');

    const botMsg = document.createElement('div');
    botMsg.className = 'msg-bot';
    botMsg.textContent = 'This is a static UI mockup — not connected to the real Claude API.';
    log.appendChild(botMsg);

    log.scrollTop = log.scrollHeight;
  }

  btn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
