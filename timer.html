<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Countdown Timer</title>
    <style>
        :root {
            --bg-color: #0a0a0b;
            --text-color: #e0e0e0;
            --accent-color: #4f46e5;
            --danger-color: #ff3e3e;
            --btn-bg: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Timer Display */
        #timer {
            font-size: 10rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: var(--btn-bg);
            color: white;
            min-width: 120px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #startBtn {
            background-color: var(--accent-color);
        }

        #resetBtn {
            background-color: #374151;
        }

        /* Flashing Animation when hits 0 */
        .flash {
            animation: pulse-red 0.8s infinite;
        }

        @keyframes pulse-red {
            0% { color: var(--text-color); text-shadow: 0 0 0px transparent; }
            50% { color: var(--danger-color); text-shadow: 0 0 20px var(--danger-color); }
            100% { color: var(--text-color); text-shadow: 0 0 0px transparent; }
        }

        @media (max-width: 600px) {
            #timer { font-size: 5rem; }
        }
    </style>
</head>
<body>

    <div id="timer">05:00</div>

    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
    </div>

    <script>
        let timeLeft = 300; // 5 minutes in seconds
        let timerId = null;
        const display = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            // Format to 00:00
            display.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) {
                // If already running, Pause it
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = 'Start';
                return;
            }

            startBtn.textContent = 'Stop';
            
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    display.classList.add('flash');
                    startBtn.textContent = 'Start';
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 300;
            updateDisplay();
            display.classList.remove('flash');
            startBtn.textContent = 'Start';
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
