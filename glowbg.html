<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cycle</title>
    <style>
        /* Setup the dark background and center everything */
        body {
            background-color: #0a0a0a;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none; /* Prevents text highlighting on click */
        }

        h1 {
            font-size: 8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            line-height: 1;
        }

        /* Initial Neon Style (Pink) */
        .neon-text {
            color: #fff;
            text-shadow: 
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #fff,
                0 0 42px #ff00de,
                0 0 82px #ff00de,
                0 0 92px #ff00de,
                0 0 102px #ff00de,
                0 0 151px #ff00de;
        }

        @media (max-width: 600px) {
            h1 { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <h1 id="neon-heading" class="neon-text">Click Me</h1>

    <script>
        const heading = document.getElementById('neon-heading');
        
        // Define 5 neon color schemes
        // Each entry contains the main glow color
        const neonColors = [
            "#ff00de", // Pink (Default)
            "#00ffff", // Cyan
            "#39ff14", // Green
            "#fff01f", // Yellow
            "#ff4d00"  // Orange/Red
        ];

        let currentIndex = 0;

        heading.addEventListener('click', () => {
            // Increment index and wrap around using modulo
            currentIndex = (currentIndex + 1) % neonColors.length;
            
            const newColor = neonColors[currentIndex];

            // Update the text shadow dynamically
            heading.style.textShadow = `
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #fff,
                0 0 42px ${newColor},
                0 0 82px ${newColor},
                0 0 92px ${newColor},
                0 0 102px ${newColor},
                0 0 151px ${newColor}
            `;
        });
    </script>
</body>
</html>
